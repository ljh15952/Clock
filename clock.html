<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Clock</title>

    <style>
        h4 {
            font-weight: normal;
        }

        input {
            width: 40px;
        }

        /* =========================
           게이지
        ========================= */

        .gauge {
            width: 300px;
            height: 20px;

            background-color: #ddd;

            border-radius: 10px;

            overflow: hidden;
        }

        #gauge-bar {
            width: 100%;
            height: 100%;

            background-color: #4caf50;

            transition: width 0.5s linear;
        }

        #gauge-text {
            width: 300px;

            text-align: center;

            margin-top: 5px;
        }
    </style>
</head>


<body>

    <label>목표 시간:</label>

    <input
        id="target-hour"
        type="number"
        min="0"
        max="23"
        placeholder="시"
    >

    <span>:</span>

    <input
        id="target-minute"
        type="number"
        min="0"
        max="59"
        placeholder="분"
    >


    <h4 id="current-time">
        현재 시간: --:--:--
    </h4>


    <h4 id="remaining-time">
        남은 시간: --시간 --분 --초
    </h4>


    <h4 id="remaining-minutes">
        남은 분 : --
    </h4>


    <h4 id="remaining-seconds">
        남은 초 : --
    </h4>


    <!-- =========================
         게이지
    ========================= -->

    <div class="gauge">

        <div id="gauge-bar"></div>

    </div>

    <div id="gauge-text">
        --%
    </div>


    <script src="src.js"></script>

</body>

</html>
