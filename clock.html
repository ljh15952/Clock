<label>목표 시간:</label>

<input
    id="target-hour"
    type="number"
    min="0"
    max="23"
    placeholder="시"
    style="width: 45px;"
>

<span>:</span>

<input
    id="target-minute"
    type="number"
    min="0"
    max="59"
    placeholder="분"
    style="width: 45px;"
>

<h4 id="current-time">현재 시간: --:--:--</h4>
<h4 id="remaining-time">남은 시간: --시간 --분 --초</h4>

<script src="src.js"></script>
